; Configuración explícita de laboratorio, sin SQL. No se carga automáticamente.
; Sustituir host/puerto por el destino autorizado antes de usar equipos físicos.
[device:plc]
protocol=SIEMENS_S7
host=127.0.0.1
port=1102
rack=0
slot=1
timeout_ms=1000
enabled=1

[tag:plc:temperatura]
address=DB100.DBD8
type=REAL
period=1
scale=1
unit=C

; El modo local conserva el lector MBTCP existente para words.
[device:medidor]
protocol=MBTCP
host=127.0.0.1
port=1502
slave=1
enabled=0

[tag:medidor:voltaje]
address=0
type=word
function=hr
period=1
scale=1
unit=V
